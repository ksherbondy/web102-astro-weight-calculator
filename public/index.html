<!DOCTYPE html>
<html lang="en">

<head>
  <title>Astro Weight Calculator</title>
  <!--Metadata-->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="keywords" content="CCCareers, web102, astro-weight-calculator, NASA">
  <meta name="description" content="Creating Coding Careers Web 102 Astro Weight Calculator Project">
  <meta name="robots" content="noindex,nofollow">
  <!--External File Links-->
  <link rel="stylesheet" href="styles.css">
  <link rel="shortcut icon" href="/assets/cccfavicon.ico" type="image/x-icon">
  <!--Google Fonts Audiowide Links-->

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet">

</head>

<body>
  <!-- Write your markup here  -->
  <section id="header">
   <header>
     <h1>Astro Weight Calculator</h1>
     <button id="theme-toggle" onclick="myFunction()">Dark Mode</button>
   </header>
  </section>
  
  <section>
    <div class="flex">
      <label id="weight-label" for="user-weight">Enter your weight </label>
      <label id="planet-label" for="planets">Select a planet</label>
    </div>

    <div class="flex">
      <input id="user-weight" type="text" placeholder="Weight (lbs)"/>
      <select id="planets">
      </select>
    </div>

    <div class="flex">
      <button id="calculate-button" onclick="handleClickEvent()">Calculate!</button>
    </div>
  </section>

  <section class="flex" id="output-container">
    <p id="output"></p>
    <img id="output-planet" src="" alt="" width="200" height="200">
  </section>

  <footer class="footer">
    <p>Creating Coding Careers Course Web 102</p>

            </ul>
